name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run unittests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Running Tests
        run: |
          go mod tidy
          make test
