name: 'Update Chart Version'
description: 'Updates version and appVersion in the helm chart'
inputs:
  version:
    description: 'Version to set in Chart.yaml'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Update version in Chart.yaml
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        sed -i "s/^version: .*/version: $VERSION/; s/^appVersion: .*/appVersion: $VERSION/" charts/developer-portal-controller/Chart.yaml

        echo "Updated Chart.yaml version to $VERSION"
        grep -E "^(version|appVersion):" charts/developer-portal-controller/Chart.yaml
